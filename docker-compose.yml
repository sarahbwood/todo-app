services:
  frontend:
    build:
      context: ./frontend/
      dockerfile: ./Dockerfile.frontend
    image: todo-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile.backend
    image: todo-backend:latest
    ports:
      - "8000:8000"
    depends_on:
      - db
  db: 
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: "todo_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "test@123"
    ports: 
      - "5432:5432"
    volumes:
      - ./seed_todo_db.sql:/docker-entrypoint-initdb.d/seed_todo_db.sql
      - pgdata:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@email.com"
      PGADMIN_DEFAULT_PASSWORD: "admin@123"
    ports:
      - "8080:80"
    depends_on:
      - db
volumes:
  pgdata: 
